<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor de Video en Iframe</title>
  <!-- Importar estilos de Plyr -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    #player {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Elemento de video con crossorigin habilitado -->
    <video id="player" controls crossorigin="anonymous"></video>
  </div>

  <!-- Script para el reproductor -->
  <script type="module">
    import './src/style.css';
    import 'plyr/dist/plyr.css';
    import VideoPlayer from './src/components/videoplayer.js';

    let player = null;

    // Función para obtener parámetros de la URL
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        episode: params.get('episode') || 'episode1',
        subtitleFile: params.get('subtitle') || null,
        videoHD: params.get('videoHD') || null,
        videoSD: params.get('videoSD') || null,
        defaultQuality: params.get('quality') || 'hd'
      };
    }

    // Función para obtener subtítulos
    async function fetchSubtitles(subnameFile, defaultfetchurl= "http://localhost:3000/api/subs/") {
      try {
        if (!subnameFile) {
          console.warn('No subtitle file specified');
          return null;
        }
        
        console.log('Fetching subtitles:', subnameFile);
        // si subnamefile es una url, lo usamos para hacer la peticion
        const urltofetch =  subnameFile.startsWith('http') ? subnameFile : defaultfetchurl + subnameFile;
        const response = await fetch(urltofetch);
        
        if (!response.ok) {
          throw new Error('Error en la respuesta del servidor: ' + response.status);
        }
        
        const data = await response.json();
        console.log('Subtítulos obtenidos correctamente');
        return data;
        
      } catch (error) {
        console.error('Error al obtener subtítulos:', error);
        return null;
      }
    }

    // Inicializar reproductor con subtítulos
    async function initializePlayerWithParams() {
      try {
        // Obtener parámetros de la URL
        const params = getUrlParams();
        console.log('URL params:', params);
        
        if (!params.videoHD && !params.videoSD) {
          console.error('No video sources provided');
          return;
        }

        // Obtener subtítulos
        const subtitleData = await fetchSubtitles(params.subtitleFile);
        
        if (!subtitleData || !subtitleData.subtitle) {
          console.warn('No subtitle data available');
          // Continuamos sin subtítulos
        } else {
          console.log('Subtitle data loaded successfully');
        }
        
        const videoElement = document.getElementById('player');
        if (!videoElement) {
          console.error('No video element found with ID "player"');
          return;
        }

        // Asegurar que el atributo crossorigin esté establecido
        videoElement.setAttribute('crossorigin', 'anonymous');
        
        // Inicializar el reproductor
        player = new VideoPlayer('player', {
          controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'fullscreen'],
          settings: ['captions', 'quality', 'speed'],
          captions: { active: true, language: 'auto', update: true },
          autoplay: false
        });

        // Configurar calidades de video
        const qualities = [];
        
        if (params.videoHD) {
          qualities.push({
            id: 'hd',
            src: params.videoHD,
            height: 720,
            type: 'video/mp4'
          });
        }
        
        if (params.videoSD) {
          qualities.push({
            id: 'sd',
            src: params.videoSD,
            height: 480,
            type: 'video/mp4'
          });
        }

        // URLs de muestra para subtítulos (solo para UI)
        const subtitulosES = './src/subtitles/sample.ass';
        const subtitulosEN = './src/subtitles/sample.ass';

        // Configurar video con subtítulos
        player.changeSource({
          qualities: qualities,
          defaultQuality: params.defaultQuality,
          captionTracks: [
            { label: 'Español', srclang: 'es', src: subtitulosES, default: true },
            { label: 'English', srclang: 'en', src: subtitulosEN }
          ]
        });

        // Inicializar JASSUB después de que Plyr esté listo
        if (subtitleData && subtitleData.subtitle) {
          player.player.on('ready', () => {
            console.log('Plyr player initialized');
            const videoElement = player.player.elements.container.querySelector('video');
            
            // Pasar el contenido de subtítulos
            player.initializeJASSUB(videoElement, subtitleData.subtitle);
          });

          // Añadir listener para cambio de calidad
          player.player.on('qualitychange', async (event) => {
            console.log('Quality changed to:', event.detail.quality);
            
            // Esperar a que se complete el cambio de calidad
            setTimeout(async () => {
              const videoElement = player.player.elements.container.querySelector('video');
              
              // Volver a inicializar JASSUB
              console.log('Reinitializing JASSUB after quality change');
              player.initializeJASSUB(videoElement, subtitleData.subtitle);
            }, 500);
          });
        }
        
      } catch (error) {
        console.error('Error initializing player:', error);
      }
    }

    // Esperar a que el DOM esté listo y luego inicializar todo
    document.addEventListener('DOMContentLoaded', initializePlayerWithParams);
  </script>
</body>
</html>
